name: Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Native window smoke test
        run: python app.py --smoke-test

  build:
    name: Build Windows executable
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Package app and recording tones
        run: python -m PyInstaller --clean --noconfirm SarvamFlow.spec
      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $app = Start-Process -FilePath .\dist\SarvamFlow.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $app.WaitForExit(60000)) {
            Stop-Process -Id $app.Id -Force
            throw 'Packaged app smoke test timed out.'
          }
          if ($app.ExitCode -ne 0) {
            throw "Packaged app smoke test failed with exit code $($app.ExitCode)."
          }
      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/SarvamFlow.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SarvamFlow.exe" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: SarvamFlow-windows-x64
          path: |
            dist/SarvamFlow.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SarvamFlow-windows-x64
          path: release
      - name: Publish executable and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/SarvamFlow.exe release/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" release/SarvamFlow.exe release/SHA256SUMS.txt \
              --verify-tag --generate-notes --title "Sarvam Flow $RELEASE_TAG"
          fi
